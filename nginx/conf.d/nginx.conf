server {
    listen 80;
    server_name cp-bot.ru  fundingradar.ru cp-bot.local;
    server_tokens off;

    # ACME webroot (обязательно доступно по http)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 8443 ssl proxy_protocol;
    server_name cp-bot.ru fundingradar.ru cp-bot.local;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/live/fundingradar.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/fundingradar.ru/privkey.pem;

    client_max_body_size 20M;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.19.0.1;
    set_real_ip_from 172.19.0.0/16;
    real_ip_header proxy_protocol;
    real_ip_recursive on;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        try_files $uri @proxy_api;
    }
    location /admin {
        try_files $uri @proxy_api;
    }

    location @proxy_api {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass   http://django-app:8000;
    }

    location /ws/ {
        proxy_pass http://django-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    location /django_static/ {
        autoindex on;
        alias /app/django_static/;
    }

}