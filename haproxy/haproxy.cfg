global
    log stdout format raw local0
    maxconn 20000
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    option tcpka
    option clitcpka
    option srvtcpka
    retries 3
    timeout connect 3s
    timeout client  90s
    timeout server  90s
    timeout tunnel 1h

frontend ft_tls
    bind 0.0.0.0:443
    mode tcp

    tcp-request inspect-delay 100ms

    # если это TLS — принимаем
    tcp-request content accept if { req.ssl_hello_type 1 }

    # --- SNI routing ---
    use_backend bk_xray_vpn  if { req.ssl_sni -i splitter.wb.ru }
    use_backend bk_xray_vpn2 if { req.ssl_sni -i m.ok.com }
    use_backend bk_xray_vpn3 if { req.ssl_sni -i queuev4.vk.com }
    use_backend bk_xray_vpn4 if { req.ssl_sni -i ads.x5.ru }
    use_backend bk_xray_vpn5 if { req.ssl_sni -i m.vk.com }
    use_backend bk_xray_vpn6 if { req.ssl_sni -i ya2.fixpr.top }
    use_backend bk_xray      if { req.ssl_sni -i eh5.vk.com www.wildberries.ru }
    use_backend bk_web       if { req.ssl_sni -i cp-bot.ru fundingradar.ru }

    # --- fallback ---
    default_backend bk_mtproto

backend bk_mtproto
    mode tcp
    server mtproto1 127.0.0.1:7443

backend bk_web
    mode tcp
    option tcp-check
    # Простой TCP healthcheck (connect)
    server nginx1 127.0.0.1:8443 check inter 2000 rise 2 fall 3 send-proxy-v2

backend bk_xray
    mode tcp
    server xray1 127.0.0.1:10000 check inter 2000 rise 2 fall 3

backend bk_xray_vpn
    mode tcp
    # новый inbound xray для vpn (порт 10001)
    server xray_vpn1 127.0.0.1:10001 check inter 2000 rise 2 fall 3

backend bk_xray_vpn2
    mode tcp
    # новый inbound xray для vpn (порт 10001)
    server xray_vpn2 127.0.0.1:10002 check inter 2000 rise 2 fall 3

backend bk_xray_vpn3
    mode tcp
    # новый inbound xray для vpn (порт 10001)
    server xray_vpn3 127.0.0.1:10003 check inter 2000 rise 2 fall 3

backend bk_xray_vpn4
    mode tcp
    # новый inbound xray для vpn (порт 10001)
    server xray_vpn4 127.0.0.1:10004 check inter 2000 rise 2 fall 3

backend bk_xray_vpn5
    mode tcp
    # новый inbound xray для vpn (порт 10001)
    server xray_vpn5 127.0.0.1:10005 check inter 2000 rise 2 fall 3

backend bk_xray_vpn6
    mode tcp
    # новый inbound xray для vpn (порт 10001)
    server xray_vpn6 127.0.0.1:10006 check inter 2000 rise 2 fall 3
