version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: my_mysql
    restart: unless-stopped
    env_file:
      - .env_dev
    network_mode: "host"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      - ./dump_structure.sql:/docker-entrypoint-initdb.d/dump_structure.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'

  redis:
    image: redis:latest
    network_mode: "host"
    restart: unless-stopped
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '1.5'

  mongodb:
    image: mongo:6
    network_mode: "host"
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 5
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '1.1'

  frontend:
    network_mode: "host"
    build:
      context: .
      dockerfile: Dockerfile-react
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    command: npm start

  django-app:
    network_mode: "host"
    build:
      context: .
      dockerfile: Dockerfile_django
    expose:
      - "8000"
    volumes:
      - static_volume:/app/django_static
      - .:/app
    depends_on:
      - mysql
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '1.5'
    restart: always

  tgbot:
    network_mode: "host"
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/CryptoTGbot.py
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
      - mongodb
    env_file:
      - .env_dev
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'

  funding_aggregator:
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/aggregator.py
    restart: always
    network_mode: "host"
    volumes:
      - .:/app
      - sockets_volume:/app/sockets
    environment:
      - SOCKET_PATH=/app/sockets/funding.sock
    depends_on:
      - mysql
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 600M
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

  funding_bybit:
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/collectors/bybit.py
    restart: always
    network_mode: "host"
    volumes:
      - .:/app
      - sockets_volume:/app/sockets
    environment:
      - SOCKET_PATH=/app/sockets/funding.sock
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 300M
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

  funding_kucoin:
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/collectors/kucoin.py
    restart: always
    network_mode: "host"
    volumes:
      - .:/app
      - sockets_volume:/app/sockets
    environment:
      - SOCKET_PATH=/app/sockets/funding.sock
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 300M
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

  funding_dexscreener:
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/collectors/dexscreener.py
    restart: always
    network_mode: "host"
    volumes:
      - .:/app
      - sockets_volume:/app/sockets
    environment:
      - SOCKET_PATH=/app/sockets/funding.sock
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 600M
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

  funding_gateio_contracts:
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/collectors/gateio_to_dex_contracts.py
    restart: always
    network_mode: "host"
    volumes:
      - .:/app
      - sockets_volume:/app/sockets
    environment:
      - SOCKET_PATH=/app/sockets/funding.sock
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 150M
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

  funding_binance_alpha:
    build:
      context: .
      dockerfile: Dockerfile_bot
    command: python funding_bot/collectors/binance_alpha_to_dex_contracts.py
    restart: always
    network_mode: "host"
    volumes:
      - .:/app
      - sockets_volume:/app/sockets
    environment:
      - SOCKET_PATH=/app/sockets/funding.sock
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env_dev
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 150M
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

volumes:
  mysql_data:
  mongo_data:
  static_volume:
  sockets_volume:
